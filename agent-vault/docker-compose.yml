services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_PATH: /data/agent_wallet.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - agent-wallet-data:/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  agent-wallet-data:
